<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Livro de Receitas</title>
    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f8f5f0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            color: #4a2c1b;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #7a5a44;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* --- FILTROS POR TIPO --- */
        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .filters button {
            background: #e4dcd3;
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            color: #4a2c1b;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .filters button:hover,
        .filters button.active {
            background: #c0392b;
            color: #fff;
            transform: scale(1.03);
        }

        /* --- GRADE DE CARTÕES --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- CARTÃO --- */
        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #f0e8e0;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
        }

        /* --- ÁREA DA IMAGEM (clicável) --- */
        .card-image {
            width: 100%;
            height: 200px;
            background: #f0ebe6;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            border-bottom: 2px solid #f0e8e0;
            transition: background 0.3s;
        }

        .card-image:hover {
            background: #e8e0d8;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-image .placeholder-icon {
            font-size: 3rem;
            color: #b8a99a;
            user-select: none;
            pointer-events: none;
            opacity: 0.6;
        }

        .card-image .upload-hint {
            position: absolute;
            bottom: 8px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .card-image:hover .upload-hint {
            opacity: 1;
        }

        /* --- CONTEÚDO DO CARTÃO --- */
        .card-body {
            padding: 16px 18px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-body .tag {
            display: inline-block;
            background: #f0e8e0;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a5a44;
            padding: 3px 12px;
            border-radius: 30px;
            margin-bottom: 10px;
            align-self: flex-start;
        }

        .card-body h3 {
            font-size: 1.1rem;
            color: #2d1c12;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-body .type-badge {
            font-size: 0.75rem;
            color: #a08070;
            margin-bottom: 12px;
        }

        .card-body .link-btn {
            margin-top: auto;
            background: #4a2c1b;
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 10px 0;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.3s;
            display: block;
        }

        .card-body .link-btn:hover {
            background: #c0392b;
        }

        /* --- OCULTAR PARA FILTRO --- */
        .card.hidden {
            display: none;
        }

        /* --- RESPONSIVO --- */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.7rem;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
            .card-image {
                height: 140px;
            }
            .card-body h3 {
                font-size: 0.95rem;
            }
            .filters button {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
        }

        @media (max-width: 420px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* --- BOTÃO DE RESET DAS IMAGENS (opcional) --- */
        .reset-btn {
            display: block;
            margin: 30px auto 10px;
            background: transparent;
            border: 1px dashed #b8a99a;
            color: #7a5a44;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .reset-btn:hover {
            background: #e4dcd3;
            border-color: #7a5a44;
        }
    </style>
</head>
<body>

    <h1>📖 Livro de Receitas</h1>
    <p class="subtitle">📸 Clique na imagem de cada cartão para adicionar uma foto</p>

    <!-- FILTROS -->
    <div class="filters">
        <button class="active" data-filter="all">🍽️ Todas</button>

    <!-- GRADE DE CARTÕES -->

    <!-- BOTÃO PARA LIMPAR TODAS AS IMAGENS (não apaga as receitas) -->

    <script>

            { name: "Arroz de tamboril", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://feed.continente.pt/receitas/arroz-de-tamboril-com-camarao" },
            { name: "Bacalhau com Natas", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.saborintenso.com/f17/bacalhau-natas-61/" },
            { name: "Bacalhau Espiritual", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://parmalat.pt/receita/bacalhau-espiritual/" },
            { name: "Arroz de Pato", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.moulinex.pt/receitas/detail/PRO/arroz-de-pato/232456" },
            { name: "Feijoada à Transmontana", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.galloportugal.com/receita/feijoada-a-transmontana/" },
            { name: "Cozido à Portuguesa", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.24kitchen.pt/receita/cozido-a-portuguesa" },

            { name: "Massa com Carne de Vaca Estufada", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://feed.continente.pt/receitas/carne-estufada" },
            { name: "Frango Assado no Forno", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.pingodoce.pt/receitas/frango-assado-no-forno/" },
            { name: "Frango à Brás", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.saborintenso.com/frango-galinha/frango-bras-1818-imprimir" },
            { name: "Frango Guisado", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.tudogostoso.com.br/receita/183204-frango-guisado-simples.html" },
            { name: "Bife com Cogumelos", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.pingodoce.pt/receitas/bife-com-molho-de-cogumelos/" },
            { name: "Bife à Portuguesa", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://teleculinaria.pt/receitas/bife-a-portuguesa-3/" },
            { name: "Lasanha de Carne", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.24kitchen.pt/receita/lasanha-classica" },
            { name: "Esparguete à Bolonhesa", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.pingodoce.pt/receitas/esparguete-a-bolonhesa/" },
            { name: "Carbonara", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.elcorteingles.pt/supermercado/receitas/super-delicioso/carbonara-autentica/" },
            { name: "Massa com Atum", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.planta.pt/recipes/receita-de-massa-com-atum-230242" },
            { name: "Empadão de Carne", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.hellmanns.pt/r/empad%C3%A3o-de-carne.html/238437" },
            { name: "Empadão de Atum", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://saboreiaavida.nestle.pt/cozinhar/receita/empadao-de-atum" },
            { name: "Arroz de Marisco", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://www.intermarchealmada.pt/arroz-de-marisco" },
            { name: "Açorda de Marisco", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://aadic.pt/receita-acorda-marisco/" },
            { name: "Polvo à Lagareiro", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://teleculinaria.pt/receitas/polvo-a-lagareiro/" },
            { name: "Salmão no Forno", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://cozinhadaraiozinho.blogs.sapo.pt/salmao-no-forno-by-jamie-oliver-216831" },

            { name: "Arroz de Frango", type: "almoço/jantar", typeLabel: "Almoço/Jantar", link: "https://pt.petitchef.com/receitas/prato-principal/arroz-de-frango-fid-896811" },
            // Entradas
            { name: "Sopa de Legumes", type: "entrada", typeLabel: "Entrada", link: "https://madebychoices.pt/sopa-de-legumes-basica/" },
            { name: "Creme de Cenoura", type: "entrada", typeLabel: "Entrada", link: "https://teleculinaria.pt/receitas/creme-de-cenoura-receita-facil-saudavel-e-deliciosa/" },
            { name: "Caldo Verde", type: "entrada", typeLabel: "Entrada", link: "https://www.saborintenso.com/videos-sopas/caldo-verde-35-imprimir" },
            { name: "Sopa de Feijão Verde", type: "entrada", typeLabel: "Entrada", link: "https://www.24kitchen.pt/receita/sopa-de-feijao-verde" },
            { name: "Salada César", type: "entrada", typeLabel: "Entrada", link: "https://www.tudogostoso.com.br/receita/7329-salada-caesar.html" },
            { name: "Salada Grega", type: "entrada", typeLabel: "Entrada", link: "https://teleculinaria.pt/receitas/receita-de-salada-grega/" },
            { name: "Salada de Atum", type: "entrada", typeLabel: "Entrada", link: "https://www.apoveira.pt/produto/salada-de-atum-portuguesa/" },
            // Sobremesas
            { name: "Arroz Doce", type: "sobremesa", typeLabel: "Sobremesa", link: "https://gracatruquesdicas.pt/2015/10/arroz-doce/" },
            { name: "Leite Creme", type: "sobremesa", typeLabel: "Sobremesa", link: "https://www.tescoma.pt/blog-leite-creme-tradicional" },
            { name: "Mousse de Chocolate", type: "sobremesa", typeLabel: "Sobremesa", link: "https://gracatruquesdicas.pt/2020/08/mousse-de-chocolate-caseira/" },
            { name: "Pudim Flan", type: "sobremesa", typeLabel: "Sobremesa", link: "https://feed.continente.pt/receitas/pudim-flan" },
            { name: "Bolo de Iogurte", type: "sobremesa", typeLabel: "Sobremesa", link: "https://docerar.pt/receitas/bolo-de-iogurte/" },
            { name: "Bolo de Chocolate", type: "sobremesa", typeLabel: "Sobremesa", link: "https://www.24kitchen.pt/receita/bolo-de-chocolate-humido" },
            { name: "Bolo de Laranja", type: "sobremesa", typeLabel: "Sobremesa", link: "https://www.tudogostoso.com.br/receita/142621-bolo-de-laranja-simples.html" },
            { name: "Tarte de Maçã", type: "sobremesa", typeLabel: "Sobremesa", link: "https://www.cincoquartosdelaranja.com/2024/11/tarte-de-maca.html" },
            { name: "Cheesecake", type: "sobremesa", typeLabel: "Sobremesa", link: "https://feed.continente.pt/receitas/cheesecake" },
            { name: "Pão de Ló", type: "sobremesa", typeLabel: "Sobremesa", link: "https://feed.continente.pt/receitas/pao-de-lo" }
        ];

        // --------------------------------------------------------------
        // 2. GUARDAR IMAGENS NO localStorage (por nome da receita)
        // --------------------------------------------------------------
        function getImageStorage() {
            const stored = localStorage.getItem('recipeImages');
            return stored ? JSON.parse(stored) : {};
        }

        function saveImageStorage(data) {
            localStorage.setItem('recipeImages', JSON.stringify(data));
        }

        // --------------------------------------------------------------
        // 3. RENDERIZAR CARTÕES
        // --------------------------------------------------------------
        const grid = document.getElementById('recipeGrid');
        let imageStore = getImageStorage();

        function renderRecipes(filter = 'all') {
            grid.innerHTML = '';
            const filtered = filter === 'all' ? recipes : recipes.filter(r => r.type === filter);

            filtered.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.type = recipe.type;

                // --- IMAGEM (clicável) ---
                const imgDiv = document.createElement('div');
                imgDiv.className = 'card-image';

                const storedImg = imageStore[recipe.name];
                if (storedImg) {
                    const img = document.createElement('img');
                    img.src = storedImg;
                    img.alt = recipe.name;
                    imgDiv.appendChild(img);
                } else {
                    const icon = document.createElement('span');
                    icon.className = 'placeholder-icon';
                    icon.textContent = '📷';
                    imgDiv.appendChild(icon);
                }

                // hint
                const hint = document.createElement('span');
                hint.className = 'upload-hint';
                hint.textContent = 'clique para adicionar foto';
                imgDiv.appendChild(hint);

                // evento de upload
                imgDiv.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.onchange = function(e2) {
                        const file = e2.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const dataUrl = ev.target.result;
                            // guardar no localStorage
                            imageStore[recipe.name] = dataUrl;
                            saveImageStorage(imageStore);
                            // actualizar apenas este cartão
                            renderRecipes(document.querySelector('.filters .active')?.dataset.filter || 'all');
                        };
                        reader.readAsDataURL(file);
                    };
                    input.click();
                });

                // --- CORPO DO CARTÃO ---
                const body = document.createElement('div');
                body.className = 'card-body';

                const tag = document.createElement('span');
                tag.className = 'tag';
                tag.textContent = recipe.typeLabel;

                const title = document.createElement('h3');
                title.textContent = recipe.name;

                const badge = document.createElement('div');
                badge.className = 'type-badge';
                badge.textContent = `🍽️ ${recipe.typeLabel}`;

                const linkBtn = document.createElement('a');
                linkBtn.className = 'link-btn';
                linkBtn.href = recipe.link.startsWith('http') ? recipe.link : `https://${recipe.link}`;
                linkBtn.target = '_blank';
                linkBtn.textContent = '👨‍🍳 Ver receita';

                body.appendChild(tag);
                body.appendChild(title);
                body.appendChild(badge);
                body.appendChild(linkBtn);

                card.appendChild(imgDiv);
                card.appendChild(body);
                grid.appendChild(card);
            });
        }

        // --------------------------------------------------------------
        // 4. FILTROS
        // --------------------------------------------------------------
        document.querySelectorAll('.filters button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const filter = this.dataset.filter;
                renderRecipes(filter);
            });
        });

        // --------------------------------------------------------------
        // 5. BOTÃO PARA REMOVER TODAS AS IMAGENS
        // --------------------------------------------------------------
        document.getElementById('resetImagesBtn').addEventListener('click', function() {
            if (confirm('Tem a certeza que quer remover TODAS as imagens? (as receitas mantêm-se)')) {
                imageStore = {};
                saveImageStorage(imageStore);
                renderRecipes(document.querySelector('.filters .active')?.dataset.filter || 'all');
            }
        });

        // --------------------------------------------------------------
        // 6. INICIALIZAR
        // --------------------------------------------------------------
        renderRecipes('all');
    </script>

</body>
</html>
