<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas · cartões com imagens</title>
    <!-- SheetJS para ler Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f7f3e9 0%, #fff9ef 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 250, 240, 0.6);
            backdrop-filter: blur(3px);
            border-radius: 48px;
            padding: 2rem 2rem 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.06);
            border: 1px solid rgba(255, 235, 200, 0.5);
        }
        h1 {
            font-weight: 500;
            font-size: 2.4rem;
            letter-spacing: -0.5px;
            color: #3d2c1e;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }
        h1 i {
            color: #c77d4a;
            font-size: 2rem;
        }
        .sub {
            color: #6b4f36;
            margin-bottom: 2rem;
            border-left: 5px solid #dba87a;
            padding-left: 1.2rem;
            font-weight: 300;
            font-size: 1.1rem;
        }
        .upload-area {
            background: #fcf6ec;
            border-radius: 80px;
            padding: 0.6rem 1.2rem 0.6rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border: 2px dashed #dabb9e;
            transition: 0.2s;
            margin-bottom: 2.2rem;
        }
        .upload-area:hover {
            border-color: #b58b6b;
            background: #faf2e4;
        }
        .upload-label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            color: #4d3826;
            font-weight: 500;
        }
        .upload-label i {
            font-size: 1.8rem;
            color: #b47d56;
        }
        #fileInput {
            display: none;
        }
        .file-status {
            font-size: 0.9rem;
            color: #7a624a;
            background: #ede3d6;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            white-space: nowrap;
            max-width: 240px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-box {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin: 1.8rem 0 2.2rem;
        }
        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 0.9rem 1.6rem;
            border-radius: 60px;
            border: 2px solid #e6d4c0;
            background: #fefcf7;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            color: #2d241c;
        }
        .search-box input:focus {
            border-color: #c3926e;
            box-shadow: 0 0 0 4px rgba(195, 146, 110, 0.2);
        }
        .search-box button {
            background: #c3926e;
            border: none;
            padding: 0.9rem 2.2rem;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 8px rgba(160, 110, 70, 0.2);
            border: 1px solid #b5825b;
        }
        .search-box button:hover {
            background: #b07954;
            transform: scale(0.97);
            box-shadow: 0 2px 6px rgba(130, 90, 55, 0.3);
        }
        .search-box button i {
            font-size: 1rem;
        }
        .result-area {
            margin-top: 1rem;
        }
        .recipe-name {
            font-size: 2rem;
            font-weight: 500;
            color: #3b2a1b;
            margin-bottom: 1.8rem;
            border-bottom: 3px solid #e7d3be;
            padding-bottom: 0.7rem;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .recipe-name i {
            color: #c2855a;
            font-size: 1.8rem;
        }
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.8rem;
            justify-items: center;
        }
        .card {
            background: white;
            border-radius: 32px;
            padding: 1rem 0.8rem 1.2rem;
            width: 100%;
            max-width: 180px;
            box-shadow: 0 10px 20px rgba(100, 70, 40, 0.08);
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #f0e3d6;
            backdrop-filter: blur(2px);
            background: rgba(255, 252, 245, 0.8);
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(130, 90, 55, 0.12);
            border-color: #dbbd9e;
        }
        .card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f3ede6;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #6a5440;
            overflow: hidden;
            margin-bottom: 0.6rem;
            background-image: radial-gradient(circle at 20% 30%, #faf3ea 2px, transparent 2px);
            background-size: 20px 20px;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 28px;
            background: #f0e3d6;
        }
        .card-img .placeholder-icon {
            font-size: 3.5rem;
            opacity: 0.5;
            color: #b49173;
        }
        .card-label {
            font-weight: 500;
            font-size: 0.95rem;
            text-align: center;
            color: #3e2e1f;
            letter-spacing: -0.2px;
            padding: 0 0.2rem;
            word-break: break-word;
        }
        .empty-state {
            text-align: center;
            padding: 3.5rem 1rem;
            color: #7f684e;
            background: #fcf5eb;
            border-radius: 60px;
            border: 2px dashed #dac6b0;
        }
        .empty-state i {
            font-size: 3rem;
            opacity: 0.5;
            margin-bottom: 1rem;
            color: #bb9b7e;
        }
        .empty-state p {
            font-size: 1.2rem;
            font-weight: 300;
        }
        .footer-note {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #9b846c;
            text-align: center;
            border-top: 1px solid #e7d7c4;
            padding-top: 1.8rem;
        }
        .badge {
            background: #dbbd9e;
            color: #3f2d1d;
            padding: 0.2rem 1.2rem;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        @media (max-width: 600px) {
            .container { padding: 1.5rem 1rem; }
            h1 { font-size: 1.8rem; }
            .upload-area { flex-direction: column; align-items: stretch; padding: 1.2rem; border-radius: 40px; }
            .file-status { max-width: 100%; white-space: normal; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        <i class="fas fa-utensils"></i> 
        Receitas em cartão
    </h1>
    <div class="sub">
        <i class="fas fa-file-excel" style="margin-right: 8px;"></i> 
        A carregar dados da Google Sheets <i class="fas fa-spinner fa-pulse" style="margin-left: 8px;"></i>
    </div>

    <!-- Área de upload (mantida para fallback) -->
    <div class="upload-area">
        <label for="fileInput" class="upload-label">
            <i class="fas fa-cloud-upload-alt"></i>
            <span>Ou carregue ficheiro Excel</span>
        </label>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
        <span class="file-status" id="fileStatus"><i class="far fa-file"></i> Nenhum ficheiro</span>
    </div>

    <!-- Pesquisa -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Pesquisar receita (ex: Bacalhau, Sopa...)" />
        <button id="searchBtn"><i class="fas fa-search"></i> Pesquisar</button>
    </div>

    <!-- Resultados -->
    <div class="result-area" id="resultArea">
        <div class="empty-state" id="emptyState">
            <i class="fas fa-spinner fa-pulse"></i>
            <p>A carregar receitas da Google Sheets...</p>
            <span style="font-size:0.9rem; color:#a68568;">Aguarde um momento</span>
        </div>
        <div id="recipeContainer" style="display: none;">
            <div class="recipe-name" id="recipeTitle">
                <i class="fas fa-book-open"></i> <span id="recipeNameDisplay"></span>
            </div>
            <div class="grid-cards" id="cardsGrid"></div>
        </div>
    </div>
    <div class="footer-note">
        <i class="fas fa-images"></i> Ingredientes com imagens · Dados carregados da Google Sheets
    </div>
</div>

<script>
    (function() {
        // ---------- ESTADO ----------
        let recipeData = [];
        let fileLoaded = false;
        const EXCEL_URL = 'https://docs.google.com/spreadsheets/d/1wIUdHQPey7cv5cAEHotRBNIFTy3dN5Zcu2GUJaI8W9s';

        // Elementos DOM
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultArea = document.getElementById('resultArea');
        const emptyState = document.getElementById('emptyState');
        const recipeContainer = document.getElementById('recipeContainer');
        const recipeNameDisplay = document.getElementById('recipeNameDisplay');
        const cardsGrid = document.getElementById('cardsGrid');
        const subHeader = document.querySelector('.sub');

        // ---------- FUNÇÕES AUXILIARES ----------
        function parseIngredients(raw) {
            if (!raw) return [];
            const cleaned = raw.replace(/\r?\n/g, ',').replace(/\s*[,;]\s*/g, ',').trim();
            if (!cleaned) return [];
            return cleaned.split(',').map(item => item.trim()).filter(item => item.length > 0);
        }

        function processExcelData(json) {
            if (!json || json.length === 0) {
                throw new Error('O Excel está vazio ou não tem dados.');
            }
            const headers = Object.keys(json[0]);
            const recipeKey = headers.find(h => h.toLowerCase().trim() === 'receita');
            const ingredientsKey = headers.find(h => h.toLowerCase().trim() === 'ingredientes');

            if (!recipeKey || !ingredientsKey) {
                throw new Error('Colunas esperadas: "Receita" e "Ingredientes". Verifique os nomes.');
            }

            const parsed = json.map(row => {
                const recipeName = String(row[recipeKey] || '').trim();
                const rawIng = String(row[ingredientsKey] || '').trim();
                const ingredientsList = parseIngredients(rawIng);
                return { recipe: recipeName, ingredients: ingredientsList };
            }).filter(item => item.recipe !== '');

            if (parsed.length === 0) {
                throw new Error('Não foram encontradas receitas com nome.');
            }
            return parsed;
        }

        // Carregar dados a partir de um URL (ArrayBuffer)
        function loadFromUrl(url) {
            subHeader.innerHTML = `<i class="fas fa-file-excel" style="margin-right: 8px;"></i> A carregar dados... <i class="fas fa-spinner fa-pulse" style="margin-left: 8px;"></i>`;
            fileStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> A carregar...`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Erro HTTP: ${response.status} - ${response.statusText}`);
                    }
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: false });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
                    recipeData = processExcelData(json);
                    fileLoaded = true;
                    fileStatus.innerHTML = `<i class="fas fa-check-circle" style="color:#7f9f6b;"></i> Dados carregados (${recipeData.length} receitas)`;
                    subHeader.innerHTML = `<i class="fas fa-file-excel" style="margin-right: 8px;"></i> Dados carregados da Google Sheets ✅`;
                    showEmptyState('Excel carregado! Pesquise uma receita.');
                })
                .catch(error => {
                    console.error('Erro ao carregar URL:', error);
                    fileStatus.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#b47d56;"></i> Erro ao carregar`;
                    subHeader.innerHTML = `<i class="fas fa-file-excel" style="margin-right: 8px;"></i> Erro ao carregar dados. Tente carregar um ficheiro manualmente.`;
                    showEmptyState('Erro ao carregar a Google Sheets. Clique em "Escolher ficheiro Excel" para carregar manualmente.');
                });
        }

        // Mostra estado vazio com mensagem personalizada
        function showEmptyState(msg) {
            emptyState.style.display = 'block';
            recipeContainer.style.display = 'none';
            emptyState.innerHTML = `
                <i class="fas fa-utensil-spoon"></i>
                <p>${msg}</p>
                <span style="font-size:0.9rem; color:#a68568;">${recipeData.length ? `${recipeData.length} receitas disponíveis` : ''}</span>
            `;
        }

        // Pesquisa e renderiza cartões
        function searchAndRender(query) {
            if (!fileLoaded || recipeData.length === 0) {
                showEmptyState('Carregue um ficheiro Excel ou aguarde o carregamento automático.');
                return;
            }

            const searchTerm = query.trim().toLowerCase();
            if (searchTerm === '') {
                showEmptyState('Digite o nome de uma receita para pesquisar.');
                return;
            }

            const found = recipeData.filter(item => 
                item.recipe.toLowerCase().includes(searchTerm)
            );

            if (found.length === 0) {
                emptyState.style.display = 'block';
                recipeContainer.style.display = 'none';
                emptyState.innerHTML = `
                    <i class="fas fa-search-minus"></i>
                    <p>Nenhuma receita encontrada para "<strong>${query}</strong>"</p>
                    <span style="font-size:0.9rem; color:#a68568;">Tente outro nome ou verifique o Excel</span>
                `;
                return;
            }

            const selected = found[0];
            renderRecipe(selected);
        }

        // Renderiza uma receita específica com cartões de ingredientes
        function renderRecipe(recipeObj) {
            emptyState.style.display = 'none';
            recipeContainer.style.display = 'block';

            recipeNameDisplay.textContent = recipeObj.recipe;

            cardsGrid.innerHTML = '';

            if (!recipeObj.ingredients || recipeObj.ingredients.length === 0) {
                cardsGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#8b735b; padding:2rem;">Esta receita não tem ingredientes listados.</div>`;
                return;
            }

            recipeObj.ingredients.forEach(ingredient => {
                const card = document.createElement('div');
                card.className = 'card';

                const imgContainer = document.createElement('div');
                imgContainer.className = 'card-img';

                const img = document.createElement('img');
                const query = encodeURIComponent(ingredient);
                img.src = `https://source.unsplash.com/featured/200x200/?${query}`;
                img.alt = ingredient;
                img.loading = 'lazy';
                img.onerror = function() {
                    this.style.display = 'none';
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-egg placeholder-icon';
                    imgContainer.appendChild(icon);
                };

                imgContainer.appendChild(img);

                const label = document.createElement('div');
                label.className = 'card-label';
                label.textContent = ingredient;

                card.appendChild(imgContainer);
                card.appendChild(label);
                cardsGrid.appendChild(card);
            });
        }

        // ---------- EVENT LISTENERS ----------
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                const file = this.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: false });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
                        recipeData = processExcelData(json);
                        fileLoaded = true;
                        fileStatus.innerHTML = `<i class="fas fa-check-circle" style="color:#7f9f6b;"></i> ${file.name} (${recipeData.length} receitas)`;
                        subHeader.innerHTML = `<i class="fas fa-file-excel" style="margin-right: 8px;"></i> Ficheiro carregado: ${file.name}`;
                        searchInput.value = '';
                        showEmptyState('Ficheiro carregado! Pesquise uma receita.');
                    } catch (error) {
                        alert('Erro ao processar o ficheiro: ' + error.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                fileStatus.innerHTML = `<i class="far fa-file"></i> Nenhum ficheiro`;
                fileLoaded = false;
                recipeData = [];
                showEmptyState('Carregue um Excel para começar.');
            }
        });

        searchBtn.addEventListener('click', function() {
            const query = searchInput.value;
            searchAndRender(query);
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchBtn.click();
            }
        });

        // ---------- INICIALIZAÇÃO: Carregar automaticamente da URL ----------
        // Mostra estado de carregamento
        showEmptyState('A carregar receitas da Google Sheets... Aguarde.');
        loadFromUrl(EXCEL_URL);
    })();
</script>
</body>
</html>
